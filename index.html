<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VideoCash</title>  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    header {
      background: #1565c0;
      color: white;
      padding: 18px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }

    .container {
      max-width: 420px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 14px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    h2 {
      text-align: center;
      margin-top: 0;
    }

    input {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      background: #1565c0;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    button.secondary {
      background: #555;
    }

    .hidden {
      display: none;
    }

    .message {
      margin-top: 12px;
      text-align: center;
      font-size: 14px;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 15px 0;
    }

    .stat {
      background: #f1f5f9;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
    }

    .stat strong {
      display: block;
      font-size: 20px;
      margin-top: 5px;
    }

    .video {
      background: #f8fafc;
      padding: 15px;
      border-radius: 10px;
      margin-top: 10px;
    }

    .timer {
      text-align: center;
      margin-top: 10px;
      font-weight: bold;
    }
  </style></head><body><header>💰 VideoCash</header><div class="container">  <!-- LOGIN -->  <div id="loginBox" class="card">
    <h2>Login</h2><input id="loginEmail" type="email" placeholder="Email">
<input id="loginPassword" type="password" placeholder="Password">

<button onclick="login()">Login</button>
<button class="secondary" onclick="showRegister()">Create Account</button>

<div id="loginMessage" class="message"></div>

  </div>  <!-- REGISTER -->  <div id="registerBox" class="card hidden">
    <h2>Create Account</h2><input id="registerUsername" type="text" placeholder="Username">
<input id="registerEmail" type="email" placeholder="Email">
<input id="registerPassword" type="password" placeholder="Password">

<button onclick="register()">Create Account</button>
<button class="secondary" onclick="showLogin()">Back to Login</button>

<div id="registerMessage" class="message"></div>

  </div>  <!-- DASHBOARD -->  <div id="dashboard" class="card hidden"><h2>Welcome</h2>

<p id="welcome"></p>

<div class="stats">

  <div class="stat">
    Balance
    <strong id="balance">$0.00</strong>
  </div>

  <div class="stat">
    Plan
    <strong id="plan">Free</strong>
  </div>

  <div class="stat">
    Views
    <strong id="views">0</strong>
  </div>

  <div class="stat">
    Earned
    <strong id="earned">$0.00</strong>
  </div>

</div>

<h3>🎬 Watch & Earn</h3>

<div id="videos">
  Loading videos...
</div>

<h3>💵 Withdraw USDT TRC20</h3>

<button onclick="withdraw()">Withdraw</button>

<button class="secondary" onclick="logout()">Logout</button>

  </div></div><script>

const API = "/api";


function showRegister() {
  document.getElementById("loginBox").classList.add("hidden");
  document.getElementById("registerBox").classList.remove("hidden");
}


function showLogin() {
  document.getElementById("registerBox").classList.add("hidden");
  document.getElementById("loginBox").classList.remove("hidden");
}


async function register() {

  const username =
    document.getElementById("registerUsername").value.trim();

  const email =
    document.getElementById("registerEmail").value.trim();

  const password =
    document.getElementById("registerPassword").value;

  const message =
    document.getElementById("registerMessage");

  message.textContent = "Creating account...";

  try {

    const response = await fetch("/api/register", {
      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        username,
        email,
        password
      })
    });

    const data = await response.json();

    if (!response.ok || !data.success) {
      message.textContent =
        data.error || "Registration failed";
      return;
    }

    message.textContent =
      "Account created successfully!";

    setTimeout(() => {
      showLogin();
    }, 1000);

  } catch (error) {

    message.textContent =
      "Connection error";
  }
}


async function login() {

  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  const message =
    document.getElementById("loginMessage");

  message.textContent = "Logging in...";

  try {

    const response = await fetch("/api/login", {
      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        email,
        password
      })
    });

    const data = await response.json();

    if (!response.ok || !data.success) {
      message.textContent =
        data.error || "Login failed";
      return;
    }

    localStorage.setItem(
      "videocash_token",
      data.token
    );

    localStorage.setItem(
      "videocash_user",
      JSON.stringify(data.user)
    );

    showDashboard(data.user);

  } catch (error) {

    message.textContent =
      "Connection error";
  }
}


function showDashboard(user) {

  document.getElementById("loginBox")
    .classList.add("hidden");

  document.getElementById("registerBox")
    .classList.add("hidden");

  document.getElementById("dashboard")
    .classList.remove("hidden");

  document.getElementById("welcome").textContent =
    "Welcome, " + user.username;

  updateUserStats(user);

  loadVideos();
}


function updateUserStats(user) {

  document.getElementById("balance").textContent =
    "$" + Number(user.balance).toFixed(2);

  document.getElementById("plan").textContent =
    user.plan;

  document.getElementById("views").textContent =
    user.views;

  document.getElementById("earned").textContent =
    "$" + Number(user.earned).toFixed(2);

  localStorage.setItem(
    "videocash_user",
    JSON.stringify(user)
  );
}


async function loadVideos() {

  const box =
    document.getElementById("videos");

  box.textContent = "Loading videos...";

  try {

    const response =
      await fetch("/api/videos");

    const data =
      await response.json();

    if (!data.success) {
      box.textContent =
        "Could not load videos";
      return;
    }

    if (!data.videos.length) {
      box.textContent =
        "No videos available";
      return;
    }

    box.innerHTML = "";

    data.videos.forEach(video => {

      const div =
        document.createElement("div");

      div.className = "video";

      div.innerHTML = `
        <strong>${video.title}</strong>

        <p>
          Duration: ${video.duration} seconds
        </p>

        <p>
          Free reward: $${Number(video.reward_free).toFixed(2)}
        </p>

        <button
          id="watch-${video.id}"
          onclick="watchVideo(${video.id}, '${video.url}', ${video.duration})">
          Watch Video
        </button>

        <div
          id="timer-${video.id}"
          class="timer">
        </div>
      `;

      box.appendChild(div);

    });

  } catch (error) {

    box.textContent =
      "Could not load videos";
  }
}


async function watchVideo(videoId, url, duration) {

  const token =
    localStorage.getItem("videocash_token");

  if (!token) {
    alert("Please login first.");
    return;
  }

  const button =
    document.getElementById("watch-" + videoId);

  const timer =
    document.getElementById("timer-" + videoId);

  button.disabled = true;

  /*
    Open the video in a new tab.
  */
  window.open(url, "_blank");


  /*
    Start the watch timer.
  */
  let remaining = Number(duration);

  timer.textContent =
    "⏳ Please watch for " + remaining + " seconds";


  const interval =
    setInterval(async () => {

      remaining--;

      if (remaining > 0) {

        timer.textContent =
          "⏳ Please watch for " +
          remaining +
          " seconds";

        return;
      }


      clearInterval(interval);

      timer.textContent =
        "⏳ Checking reward...";


      try {

        const response =
          await fetch("/api/claim-video", {

            method: "POST",

            headers: {
              "Content-Type": "application/json",
              "Authorization": "Bearer " + token
            },

            body: JSON.stringify({
              video_id: videoId
            })

          });


        const data =
          await response.json();


        if (!response.ok || !data.success) {

          timer.textContent =
            "❌ " +
            (data.error || "Reward failed");

          button.disabled = false;

          return;
        }


        /*
          Update balance, views and earned.
        */
        updateUserStats(data.user);


        timer.textContent =
          "✅ Reward added: $" +
          Number(data.reward).toFixed(2);

      } catch (error) {

        timer.textContent =
          "❌ Connection error";

        button.disabled = false;
      }

    }, 1000);

}


function withdraw() {

  alert(
    "Withdrawal system will be connected next."
  );
}


function logout() {

  localStorage.removeItem(
    "videocash_token"
  );

  localStorage.removeItem(
    "videocash_user"
  );

  location.reload();
}


window.addEventListener(
  "DOMContentLoaded",
  () => {

    const savedUser =
      localStorage.getItem(
        "videocash_user"
      );

    if (savedUser) {

      try {

        const user =
          JSON.parse(savedUser);

        showDashboard(user);

      } catch (error) {

        localStorage.removeItem(
          "videocash_user"
        );

      }
    }

  }
);

</script></body>
</html>
